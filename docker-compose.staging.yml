services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    ports:
      - "3001:3000"
    env_file:
      - .env.staging
    networks:
      - staging-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ngurra_flora_staging
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    networks:
      - staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  staging-net:
    external: true

volumes:
  staging_db_data: