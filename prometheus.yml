global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "ngurra-staging"
    static_configs:
      - targets: ["ngurra-staging-app-1:3000"]
        labels:
          environment: staging

  - job_name: "ngurra-production"
    static_configs:
      - targets: ["ngurra-production-app-1:3000"]
        labels:
          environment: production