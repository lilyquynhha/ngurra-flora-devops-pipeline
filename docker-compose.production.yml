services:
  app:
    build: .
    ports:
      - "3002:3000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ngurra_flora_prod
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prod_db_data:
