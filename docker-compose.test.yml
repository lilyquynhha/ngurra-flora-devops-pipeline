services:
  test-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ngurra_flora_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: .
      target: builder
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@test-db:5432/ngurra_flora_test"
    command: sh -c "npx prisma migrate deploy --schema=src/prisma/schema.prisma && npm test"
