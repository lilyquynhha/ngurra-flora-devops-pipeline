global:
  resolve_timeout: 5m

route:
  receiver: "slack-notifications"
  group_wait: 10s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: "slack-notifications"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#ngurra-alerts"
        send_resolved: true
        title: >-
          {{ if eq .Status "firing" }}{{ .CommonAnnotations.summary }}{{ else }}Resolved: {{ .CommonLabels.job }} is back up{{ end }}
        text: >-
          {{ if eq .Status "firing" }}{{ .CommonAnnotations.description }}{{ else }}{{ .CommonLabels.job }} is reachable again.{{ end }}